name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Privacy gate
        shell: pwsh
        run: ./scripts/check-release-privacy.ps1
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm run build
      - name: Test backend
        working-directory: src-tauri
        run: cargo test
      - name: Build signed updater and draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: InstaVault v__VERSION__
          releaseBody: |
            Primera versión estable de InstaVault.

            - Biblioteca privada en SQLite
            - Descargas en máxima calidad disponible
            - Actualizaciones automáticas vía GitHub
            - Nueva interfaz oscura profesional
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
