name: CI

# Compila y prueba desde un checkout limpio: un archivo que no esté en git
# rompe aquí en lugar de llegar a otra máquina.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and privacy tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
